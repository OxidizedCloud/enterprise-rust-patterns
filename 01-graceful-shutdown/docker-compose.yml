version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=graceful_shutdown=debug,tower_http=info
      - PORT=8080
    stop_grace_period: 30s # Match standard Kubernetes terminationGracePeriodSeconds
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC
